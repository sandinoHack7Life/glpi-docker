version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: glpi_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=Cloud*Mega*2026
      - MYSQL_DATABASE=glpidb
      - MYSQL_USER=phcadmin
      - MYSQL_PASSWORD=Cloud*Mega*2026
    volumes:
      - db_data:/var/lib/mysql
    networks:
      glpi_net:

  glpi:
    image: elestio/glpi:latest
    container_name: glpi_app
    restart: always
    ports:
      - "80:80"
    environment:
      - TIMEZONE=Africa/Maputo
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes:
      - glpi_data:/var/www/html/glpi/files
      - glpi_config:/var/www/html/glpi/config
    networks:
      glpi_net:
        ipv4_address: 192.168.1.212

volumes:
  glpi_data:
  glpi_config:
  db_data:

networks:
  glpi_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1
