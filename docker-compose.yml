version: '3.8'

services:
  glpi:
    image: diapers/glpi:latest
    container_name: glpi_app
    restart: always
    ports:
      - "80:80"
    environment:
      - TIMEZONE=Africa/Maputo
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes:
      - glpi_data:/var/www/html/glpi/files
      - glpi_config:/var/www/html/glpi/config

volumes:
  glpi_data:
  glpi_config:
